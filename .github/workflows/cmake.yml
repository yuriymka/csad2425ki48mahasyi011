name: CMake Build and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up CMake
        uses: lukka/get-cmake@v3
      - name: Configure and Build
        run: |
          mkdir build
          cd build
          cmake ..
          cmake --build .
      - name: Run Tests
        run: |
          cd Receiver
          test
